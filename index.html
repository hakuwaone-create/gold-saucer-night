<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゴールドソーサーの夜会 | ONLINE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#49232e,#17101b 55%,#09080e);color:#f2d9a0;font-family:system-ui,"Yu Gothic",sans-serif;min-height:100vh}main{max-width:540px;margin:auto;padding:35px 18px 65px}h1{text-align:center;font-size:clamp(23px,6vw,32px);letter-spacing:.08em;margin:8px 0}.sub{text-align:center;font-size:12px;letter-spacing:.25em;color:#c9a676;margin-bottom:28px}.crest{text-align:center;font-size:43px}.panel{background:#1d1420;border:1px solid #9c7445;border-radius:14px;padding:22px;margin-top:20px;box-shadow:0 12px 28px #0007}h2{font-size:18px}label{display:block;margin:18px 0 6px;font-size:13px}input{width:100%;padding:14px;background:#0c0b12;color:white;border:1px solid #806342;border-radius:8px;font-size:17px}button{display:block;width:100%;padding:14px;margin-top:13px;border:1px solid #d3a655;border-radius:8px;background:linear-gradient(#f2d38b,#b78237);color:#28190e;font-size:16px;font-weight:800;cursor:pointer}button.alt{background:#332331;color:#efd69d}button:disabled{opacity:.4;cursor:wait}.hide{display:none!important}.notice{margin:12px 0;padding:12px;border:1px solid #a4794a;border-radius:8px;white-space:pre-wrap;line-height:1.6;font-size:13px}.code{text-align:center;font-size:40px;letter-spacing:.17em;font-weight:900}.person{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #594331;padding:12px 0;font-size:14px}.muted{font-size:12px;color:#bda88e;line-height:1.7}.center{text-align:center}.row{display:flex;gap:9px}.row button{min-width:0}
 .hand{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0}.card{width:65px;height:102px;border:2px solid #ba8a49;border-radius:9px;background:linear-gradient(140deg,#f4ddb2,#b28a4f);color:#251426;font-size:25px;font-weight:900;cursor:pointer;margin:0;padding:0}.card.selected{transform:translateY(-12px);border:3px solid #f8ed9b;box-shadow:0 0 15px #d6a24b}.card:disabled{opacity:.55;cursor:default}.gamePlayer{font-size:13px;padding:8px;border-bottom:1px solid #60462d}</style></head><body><main><div class="crest">🎩🃏</div><h1>ゴールドソーサーの夜会</h1><div class="sub">GOLD SAUCER NIGHT · ONLINE</div>
<div id="message" class="notice hide" role="status"></div>
<section id="entry" class="panel"><h2>◆ 夜会への招待</h2><label for="name">プレイヤー名</label><input id="name" maxlength="20" placeholder="名前を入力"><button id="create">👑 新しい部屋を作る</button><p class="muted center">── または ──</p><label for="codeInput">6桁のルームコード</label><input id="codeInput" inputmode="numeric" maxlength="6" placeholder="000000"><button id="join" class="alt">🚪 部屋に参加する</button><p class="muted">初回は匿名ログインを使用します。アカウント登録は不要です。</p></section>
<section id="room" class="panel hide"><h2>◆ 夜会の控室</h2><p class="muted center">ルームコード</p><div id="code" class="code"></div><button id="copy" class="alt">📋 コードをコピー</button><p id="status" class="center"></p><div id="players"></div><div class="row"><button id="ready">✋ 準備完了</button><button id="start" class="alt hide">🎮 ゲーム開始</button></div><button id="leave" class="alt">退出する</button><p class="muted">Ver.0.8はロビー接続テストです。カード対戦は次のバージョンで実装します。</p></section>
<section id="playing" class="panel hide"><h2>🎰 夜会、開幕！</h2><p id="gameInfo" class="center"></p><div id="gamePlayers"></div><p id="gameTurn" class="center"></p><div id="hand" class="hand"></div><p id="selectionInfo" class="muted center">手札から1〜3枚を選択</p><button id="playCards">🃏 選んだカードを伏せて出す</button><button id="acceptCards" class="alt hide">続行する（チャレンジしない）</button><p class="muted">Ver.0.9先行版：手札配布・提出・順番同期まで。LIAR!判定とリボルバーは次の更新で実装します。</p><button id="leavePlaying" class="alt">退出する</button></section>
<p class="muted center">Ver.0.9 · カード配布・提出テスト</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id), PROJECT_URL="https://ngcfidzjvlawtspevdkk.supabase.co",KEY="sb_publishable_V9JLrLMy3FK2TaMdgUXmbQ_Nn4w0B-p";
const db=window.supabase?.createClient(PROJECT_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let user=null,room=null,roomCode="",poll=null,busy=false,gamePoll=null,gameData=null,selected=new Set();
function show(id){for(const s of ["entry","room","playing"])$(s).classList.toggle("hide",s!==id)}
function note(t){$("message").textContent=t;$("message").classList.toggle("hide",!t)}
function error(e){note("⚠ "+(e?.message||String(e)))}
async function login(){if(!db)throw Error("通信ライブラリが読み込めません。ネット接続を確認してください");const s=await db.auth.getSession();if(s.error)throw s.error;if(s.data.session){user=s.data.session.user;return}const a=await db.auth.signInAnonymously();if(a.error)throw Error("匿名ログインに失敗しました。SupabaseでAnonymous Sign-insを有効にしてください。詳細: "+a.error.message);user=a.data.user}
function nickname(){const n=$("name").value.trim();if(!n||n.length>20)throw Error("プレイヤー名を1〜20文字で入力してください");try{localStorage.setItem("night_name",n)}catch(_){}return n}
async function action(fn){if(busy)return;busy=true;note("⏳ ボタンを受け付けました。接続しています…");for(const b of ["create","join","ready","start","leave","leavePlaying"])$(b).disabled=true;try{await Promise.race([(async()=>{await login();await fn()})(),new Promise((_,reject)=>setTimeout(()=>reject(Error("接続が30秒以上応答しません。匿名ログイン設定と通信状況を確認してください")),30000))]);note("")}catch(e){error(e)}finally{busy=false;for(const b of ["create","join","ready","start","leave","leavePlaying"])$(b).disabled=false}}
function stop(){if(poll){clearInterval(poll);poll=null}if(gamePoll){clearInterval(gamePoll);gamePoll=null}}
async function refresh(){if(!room)return;const r=await db.from("night_rooms").select("id,code,host_id,status").eq("id",room).maybeSingle();if(r.error)throw r.error;if(!r.data){stop();room=null;show("entry");note("部屋が終了しました");return}const p=await db.from("night_players").select("user_id,display_name,ready,seat").eq("room_id",room).order("seat");if(p.error)throw p.error;const list=p.data||[],me=list.find(x=>x.user_id===user.id);if(!me){stop();room=null;show("entry");note("退出しました");return}roomCode=r.data.code;if(r.data.status==="playing"){show("playing");if(!gamePoll){gamePoll=setInterval(()=>{if(!busy)refreshGame().catch(error)},2200)}await refreshGame();if(poll){clearInterval(poll);poll=null}return}show("room");$("code").textContent=roomCode;$("status").textContent=list.length+" / 4 人参加中";const wrap=$("players");wrap.replaceChildren();for(const x of list){const d=document.createElement("div");d.className="person";const a=document.createElement("span"),b=document.createElement("span");a.textContent=x.seat+" · "+x.display_name+(x.user_id===user.id?"（あなた）":"");b.textContent=(x.user_id===r.data.host_id?"👑 ":"")+(x.ready?"✓ READY":"待機中");d.append(a,b);wrap.append(d)}$("ready").textContent=me.ready?"↩ 準備を取り消す":"✋ 準備完了";$("start").classList.toggle("hide",r.data.host_id!==user.id);$("start").disabled=list.length<2||list.some(x=>!x.ready)}
async function enter(id){room=id;await refresh();stop();if(room&&!gamePoll)poll=setInterval(()=>{if(!busy)refresh().catch(error)},2200)}
$("create").addEventListener("click",()=>action(async()=>{const n=nickname(),r=await db.rpc("night_create_room",{p_name:n});if(r.error)throw r.error;const f=await db.from("night_rooms").select("id").eq("code",r.data).single();if(f.error)throw f.error;await enter(f.data.id)}));
$("join").addEventListener("click",()=>action(async()=>{const n=nickname(),c=$("codeInput").value.trim();if(!/^\d{6}$/.test(c))throw Error("6桁のルームコードを入力してください");const r=await db.rpc("night_join_room",{p_code:c,p_name:n});if(r.error)throw r.error;await enter(r.data)}));
$("ready").addEventListener("click",()=>action(async()=>{const p=await db.from("night_players").select("ready").eq("room_id",room).eq("user_id",user.id).single();if(p.error)throw p.error;const r=await db.rpc("night_set_ready",{p_room:room,p_ready:!p.data.ready});if(r.error)throw r.error;await refresh()}));
$("start").addEventListener("click",()=>action(async()=>{const r=await db.rpc("night_start_room",{p_room:room});if(r.error)throw r.error;const b=await db.rpc("night_game_begin",{p_room:room});if(b.error)throw b.error;await refresh()}));
async function refreshGame(){
 if(!room)return;
 const v=await db.rpc("night_game_view",{p_room:room});if(v.error)throw v.error;
 gameData=v.data;const g=v.data;
 if(!g.initialized){$("gameInfo").textContent="カードを配っています…";return}
 const mine=g.turn_user===user.id;
 $("gameInfo").textContent="宣言ランク："+g.declared+"　｜　場のカード："+g.pile_count+"枚";
 const players=$("gamePlayers");players.replaceChildren();
 for(const p of g.players){const d=document.createElement("div");d.className="gamePlayer";d.textContent=(p.user_id===g.turn_user?"▶ ":"")+(p.user_id===user.id?"あなた / ":"")+p.name+"　手札 "+p.count+"枚";players.append(d)}
 $("gameTurn").textContent=mine?(g.phase==="challenge"?"相手のカードを受け入れるか選択":"あなたの番です"):"ほかのプレイヤーの操作を待っています";
 const hand=$("hand");hand.replaceChildren();
 (g.hand||[]).forEach((c,i)=>{const b=document.createElement("button");b.className="card"+(selected.has(i)?" selected":"");b.textContent=c;b.disabled=!mine||g.phase!=="play";b.onclick=()=>{if(selected.has(i))selected.delete(i);else if(selected.size<3)selected.add(i);refreshHandSelection()};hand.append(b)});
 $("playCards").classList.toggle("hide",g.phase!=="play");$("playCards").disabled=!mine||selected.size===0;
 $("acceptCards").classList.toggle("hide",g.phase!=="challenge");$("acceptCards").disabled=!mine;
 if(g.phase==="challenge")$("selectionInfo").textContent="LIAR!は次の更新で追加予定。現在は続行のみ";else refreshHandSelection();
}
function refreshHandSelection(){const cards=$("hand").children;for(let i=0;i<cards.length;i++)cards[i].classList.toggle("selected",selected.has(i));$("selectionInfo").textContent=selected.size+"枚選択中（最大3枚）";$("playCards").disabled=!gameData||gameData.turn_user!==user.id||selected.size===0}
$("playCards").addEventListener("click",()=>action(async()=>{const r=await db.rpc("night_game_play",{p_room:room,p_indices:[...selected]});if(r.error)throw r.error;selected.clear();await refreshGame()}));
$("acceptCards").addEventListener("click",()=>action(async()=>{const r=await db.rpc("night_game_accept",{p_room:room});if(r.error)throw r.error;await refreshGame()}));
async function leave(){if(!room)return;const r=await db.rpc("night_leave_room",{p_room:room});if(r.error)throw r.error;stop();room=null;show("entry")}
$("leave").addEventListener("click",()=>action(leave));$("leavePlaying").addEventListener("click",()=>action(leave));
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(roomCode);note("コードをコピーしました")}catch(e){note("ルームコード: "+roomCode)}});
try{$("name").value=localStorage.getItem("night_name")||""}catch(_){}
if(!db)note("⚠ 通信ライブラリの読み込みに失敗しました。ネット接続を確認してください。");
window.addEventListener("error",e=>note("⚠ JavaScriptエラー: "+e.message));
window.addEventListener("unhandledrejection",e=>note("⚠ 通信エラー: "+(e.reason?.message||e.reason)));
</script></body></html>
