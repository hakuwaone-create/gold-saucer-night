 $("gameInfo").textContent="宣言ランク："+g.declared+"　｜　場のカード："+g.pile_count+"枚";
 const players=$("gamePlayers");players.replaceChildren();
 for(const p of g.players){const d=document.createElement("div");d.className="gamePlayer";d.textContent=(p.user_id===g.turn_user?"▶ ":"")+(p.user_id===user.id?"あなた / ":"")+p.name+"　"+(p.alive?"手札 "+p.count+"枚 / 危険度 "+(p.shots+1)+"/6":"💀 脱落");players.append(d)}
 $("gameTurn").textContent=g.phase==="finished"?"🏆 勝者："+(g.players.find(p=>p.user_id===g.winner)?.name||"不明"):g.phase==="roulette"?"🔫 敗者が引き金を引く番です":mine?(g.phase==="challenge"?"信じる？ それともLIAR!？":"あなたの番です"):"ほかのプレイヤーの操作を待っています";
 const hand=$("hand");hand.replaceChildren();
 (g.hand||[]).forEach((c,i)=>{const b=document.createElement("button");b.className="card"+(selected.has(i)?" selected":"");decorateCard(b,c);b.disabled=!mine||g.phase!=="play";b.onclick=()=>{if(selected.has(i))selected.delete(i);else if(selected.size<3)selected.add(i);refreshHandSelection()};hand.append(b)});
 $("playCards").classList.toggle("hide",g.phase!=="play");$("playCards").disabled=!mine||selected.size===0;
 $("acceptCards").classList.toggle("hide",g.phase!=="challenge");$("acceptCards").disabled=!mine;
 $("challengeCards").classList.toggle("hide",g.phase!=="challenge");$("challengeCards").disabled=!mine;
 $("trigger").classList.toggle("hide",g.phase!=="roulette");$("trigger").disabled=g.loser!==user.id;
 const rev=$("revealBox");rev.classList.toggle("hide",g.phase!=="roulette");if(g.phase==="roulette"){rev.textContent="🟥 LIAR!　公開カード："+(g.reveal||[]).join(" · ")+"　｜　敗者："+(g.players.find(p=>p.user_id===g.loser)?.name||"不明")}
 if(g.phase==="finished"){$("revealBox").classList.remove("hide");$("revealBox").textContent="🏆 WINNER 🏆　"+(g.players.find(p=>p.user_id===g.winner)?.name||"")};
 if(g.phase==="challenge")$("selectionInfo").textContent="信じて続行するか、LIAR!を宣言！";else refreshHandSelection();
}
function refreshHandSelection(){const cards=$("hand").children;for(let i=0;i<cards.length;i++)cards[i].classList.toggle("selected",selected.has(i));$("selectionInfo").textContent=selected.size+"枚選択中（最大3枚）";$("playCards").disabled=!gameData||gameData.turn_user!==user.id||selected.size===0}
$("playCards").addEventListener("click",()=>action(async()=>{const r=await db.rpc("night_game_play",{p_room:room,p_indices:[...selected]});if(r.error)throw r.error;selected.clear();await refreshGame()}));
$("acceptCards").addEventListener("click",()=>action(async()=>{const r=await db.rpc("night_game_accept",{p_room:room});if(r.error)throw r.error;await refreshGame()}));
$("challengeCards").addEventListener("click",()=>action(async()=>{const r=await db.rpc("night_game_challenge",{p_room:room});if(r.error)throw r.error;await refreshGame()}));
$("trigger").addEventListener("click",()=>action(async()=>{const r=await db.rpc("night_game_trigger",{p_room:room});if(r.error)throw r.error;const box=$("rouletteMessage");box.classList.remove("hide");box.innerHTML="";const div=document.createElement("div");div.className=r.data==="BANG"?"bang":"click";div.textContent=r.data==="BANG"?"💥 BANG!!":"🔫 CLICK… 生存！";box.append(div);fxResult(r.data);await refreshGame()}));
async function leave(){if(!room)return;const r=await db.rpc("night_leave_room",{p_room:room});if(r.error)throw r.error;stop();room=null;show("entry")}
$("leave").addEventListener("click",()=>action(leave));$("leavePlaying").addEventListener("click",()=>action(leave));
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(roomCode);note("コードをコピーしました")}catch(e){note("ルームコード: "+roomCode)}});
try{$("name").value=localStorage.getItem("night_name")||""}catch(_){}
if(!db)note("⚠ 通信ライブラリの読み込みに失敗しました。ネット接続を確認してください。");
window.addEventListener("error",e=>note("⚠ JavaScriptエラー: "+e.message));
window.addEventListener("unhandledrejection",e=>note("⚠ 通信エラー: "+(e.reason?.message||e.reason)));
</script></body></html>
